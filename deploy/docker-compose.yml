# Server mode for offices with several PCs: desktop clients connect with
# "Connect to a server" and pick their company.
#
#   cp deploy/.env.server.example deploy/.env      # then edit secrets
#   docker compose -f deploy/docker-compose.yml up -d --build
#   docker compose -f deploy/docker-compose.yml exec app php artisan erp:company elite "النخبة للتجارة" --admin-password='…'
x-backend: &backend
  image: manzoma-erp-backend:local
  env_file: .env
  environment: &backend-environment
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    ERP_MULTI_COMPANY: "true"
    ERP_COMPANIES_REGISTRY: /var/www/erp/storage/app/companies.json
    ERP_BACKUP_PATH: /var/www/erp/storage/backups
    QUEUE_CONNECTION: database
  volumes:
    - erp-storage:/var/www/erp/storage
    - erp-public:/var/www/erp/public
  restart: unless-stopped

services:
  app:
    <<: *backend
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);\" && php artisan erp:health --all --ready --json"]
      interval: 60s
      timeout: 60s
      start_period: 90s
      retries: 3

  scheduler:
    <<: *backend
    entrypoint: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  worker:
    <<: *backend
    entrypoint: ["php", "artisan", "erp:queue-supervise"]
    depends_on:
      app:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${ERP_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - erp-public:/var/www/erp/public:ro
    depends_on: [app]
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - erp-mysql:/var/lib/mysql
      - ./mysql-grants.sh:/docker-entrypoint-initdb.d/10-grants.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10
    restart: unless-stopped

volumes:
  erp-storage:
  erp-mysql:
  erp-public:
